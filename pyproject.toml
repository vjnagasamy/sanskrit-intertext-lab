[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanskrit-intertext-lab"
version = "0.1.0"
description = "Sanskrit segmentation, embedding, and pairwise similarity workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate",
    "huggingface-hub",
    "indic-transliteration",
    "numpy",
    "pandas",
    "sentence-transformers>=2.2.0",
    "setuptools<81",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "wheel",
]

[project.optional-dependencies]
dev = [
    "ruff",
]
stanza = [
    "stanza",
]
ann = [
    "faiss-cpu",
]
notebooks = [
    "ipykernel",
    "jupyterlab",
]
viz = [
    "matplotlib",
    "plotly",
    "seaborn",
]

[tool.setuptools.packages.find]
include = ["sanskrit_pipeline*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
